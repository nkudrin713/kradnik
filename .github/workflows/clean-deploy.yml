name: Clean Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to reset"
        required: true
        type: choice
        options:
          - development
          - production
      confirm:
        description: "Type RESET to drop server containers, images, and database volume"
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

env:
  TELEGRAM_BOT_API_COMMIT: adfd7f6a8e990272851777eeb3ae0def4216f161
  TELEGRAM_BOT_API_IMAGE: ghcr.io/nkudrin713/kradnik-telegram-bot-api:adfd7f6a8e990272851777eeb3ae0def4216f161
  YOUTUBE_PO_TOKEN_PROVIDER_IMAGE: brainicism/bgutil-ytdlp-pot-provider:1.3.2-deno

jobs:
  checks:
    name: Tests and checks
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    if: ${{ inputs.confirm == 'RESET' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Run tests and build jar
        run: ./gradlew check bootJar

      - name: Prepare Docker context
        run: |
          set -euo pipefail
          mkdir -p .deploy
          cp build/libs/app.jar .deploy/app.jar

      - name: Set image name
        run: |
          set -euo pipefail
          echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest

      - name: Check Telegram Bot API image
        id: telegram_bot_api_image
        run: |
          if docker buildx imagetools inspect "$TELEGRAM_BOT_API_IMAGE" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push Telegram Bot API image
        if: ${{ steps.telegram_bot_api_image.outputs.exists != 'true' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.telegram-bot-api
          push: true
          build-args: TELEGRAM_BOT_API_COMMIT=${{ env.TELEGRAM_BOT_API_COMMIT }}
          cache-from: type=gha,scope=telegram-bot-api
          cache-to: type=gha,mode=max,scope=telegram-bot-api
          tags: ${{ env.TELEGRAM_BOT_API_IMAGE }}

  clean-deploy:
    name: Clean deploy to server
    runs-on: ubuntu-latest
    needs: checks
    environment: ${{ inputs.environment }}
    concurrency:
      group: deploy-server
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Sync compose file
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_PATH"
          test "$DEPLOY_PATH" != "/"
          tar -czf - docker-compose.yml \
            | ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$DEPLOY_PATH' && tar -xzf - -C '$DEPLOY_PATH'"

      - name: Write environment
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          METABASE_ANALYTICS_DB_PASSWORD: ${{ secrets.METABASE_ANALYTICS_DB_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_LOCAL_API_ENABLED: ${{ vars.TELEGRAM_LOCAL_API_ENABLED || 'false' }}
          YOUTUBE_PO_TOKEN_PROVIDER_ENABLED: ${{ vars.YOUTUBE_PO_TOKEN_PROVIDER_ENABLED || 'false' }}
          TELEGRAM_BOT_API_URL: ${{ vars.TELEGRAM_BOT_API_URL }}
          TELEGRAM_BOT_FILE_API_URL: ${{ vars.TELEGRAM_BOT_FILE_API_URL }}
          TELEGRAM_MAX_UPLOAD_BYTES: ${{ vars.TELEGRAM_MAX_UPLOAD_BYTES }}
          TELEGRAM_CONNECT_TIMEOUT: ${{ vars.TELEGRAM_CONNECT_TIMEOUT || '10s' }}
          TELEGRAM_REQUEST_TIMEOUT: ${{ vars.TELEGRAM_REQUEST_TIMEOUT || '60m' }}
          DOWNLOAD_WORK_DIR_RESERVE_BYTES: ${{ vars.DOWNLOAD_WORK_DIR_RESERVE_BYTES || '536870912' }}
          DOWNLOAD_YT_DLP_METADATA_TIMEOUT: ${{ vars.DOWNLOAD_YT_DLP_METADATA_TIMEOUT || '30s' }}
          DOWNLOAD_YT_DLP_DOWNLOAD_TIMEOUT: ${{ vars.DOWNLOAD_YT_DLP_DOWNLOAD_TIMEOUT || '30m' }}
          DOWNLOAD_INSTAGRAM_METADATA_TIMEOUT: ${{ vars.DOWNLOAD_INSTAGRAM_METADATA_TIMEOUT || '30s' }}
          DOWNLOAD_INSTAGRAM_DOWNLOAD_TIMEOUT: ${{ vars.DOWNLOAD_INSTAGRAM_DOWNLOAD_TIMEOUT || '10m' }}
          DOWNLOAD_VIDEO_FFMPEG_TIMEOUT: ${{ vars.DOWNLOAD_VIDEO_FFMPEG_TIMEOUT || '20m' }}
          TELEGRAM_DONATION_URL: ${{ vars.TELEGRAM_DONATION_URL || secrets.TELEGRAM_DONATION_URL }}
          TELEGRAM_DONATION_CHANNEL_ID: ${{ vars.TELEGRAM_DONATION_CHANNEL_ID || secrets.TELEGRAM_DONATION_CHANNEL_ID }}
          TELEGRAM_DONATION_PIN_ENABLED: ${{ vars.TELEGRAM_DONATION_PIN_ENABLED || secrets.TELEGRAM_DONATION_PIN_ENABLED }}
          TELEGRAM_DONATION_PIN_MESSAGE_ID: ${{ vars.TELEGRAM_DONATION_PIN_MESSAGE_ID || secrets.TELEGRAM_DONATION_PIN_MESSAGE_ID }}
          DOWNLOAD_PLATFORM_YOUTUBE_ENABLED: ${{ vars.DOWNLOAD_PLATFORM_YOUTUBE_ENABLED || secrets.DOWNLOAD_PLATFORM_YOUTUBE_ENABLED }}
          DOWNLOAD_PLATFORM_INSTAGRAM_ENABLED: ${{ vars.DOWNLOAD_PLATFORM_INSTAGRAM_ENABLED || secrets.DOWNLOAD_PLATFORM_INSTAGRAM_ENABLED }}
          DOWNLOAD_PLATFORM_VK_ENABLED: ${{ vars.DOWNLOAD_PLATFORM_VK_ENABLED || secrets.DOWNLOAD_PLATFORM_VK_ENABLED }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_PATH"
          test "$DEPLOY_PATH" != "/"
          app_image="ghcr.io/${GITHUB_REPOSITORY,,}:$GITHUB_SHA"
          metabase_analytics_db_password="${METABASE_ANALYTICS_DB_PASSWORD:-$POSTGRES_PASSWORD}"
          telegram_local_api_enabled="${TELEGRAM_LOCAL_API_ENABLED:-false}"
          case "$telegram_local_api_enabled" in true|false) ;; *) echo 'TELEGRAM_LOCAL_API_ENABLED must be true or false' >&2; exit 1 ;; esac
          youtube_po_token_provider_enabled="${YOUTUBE_PO_TOKEN_PROVIDER_ENABLED:-false}"
          case "$youtube_po_token_provider_enabled" in true|false) ;; *) echo 'YOUTUBE_PO_TOKEN_PROVIDER_ENABLED must be true or false' >&2; exit 1 ;; esac
          if [ "${{ inputs.environment }}" = "production" ] && [ "$telegram_local_api_enabled" = "true" ]; then
            echo 'Local Telegram Bot API is not approved for production' >&2
            exit 1
          fi
          if [ "${{ inputs.environment }}" = "production" ] && [ "$youtube_po_token_provider_enabled" = "true" ]; then
            echo 'YouTube PO Token Provider is not approved for production' >&2
            exit 1
          fi
          if [ "$telegram_local_api_enabled" = "true" ]; then
            test -n "$TELEGRAM_API_ID"
            test -n "$TELEGRAM_API_HASH"
            telegram_bot_api_url="${TELEGRAM_BOT_API_URL:-http://telegram-bot-api:8081/bot}"
            telegram_bot_file_api_url="${TELEGRAM_BOT_FILE_API_URL:-http://telegram-bot-api:8081/file/bot}"
            telegram_max_upload_bytes="${TELEGRAM_MAX_UPLOAD_BYTES:-2000000000}"
            download_work_dir="/var/lib/kradnik/media"
          else
            telegram_bot_api_url="${TELEGRAM_BOT_API_URL:-https://api.telegram.org/bot}"
            telegram_bot_file_api_url="${TELEGRAM_BOT_FILE_API_URL:-https://api.telegram.org/file/bot}"
            telegram_max_upload_bytes="${TELEGRAM_MAX_UPLOAD_BYTES:-47185920}"
            download_work_dir="/tmp/kradnik-downloads"
          fi
          if [ "$youtube_po_token_provider_enabled" = "true" ]; then
            youtube_po_token_provider_url="http://youtube-pot-provider:4416"
          else
            youtube_po_token_provider_url=""
          fi
          if [ "${{ inputs.environment }}" = "production" ]; then
            app_environment="prod"
            app_container_name="kradnik-prod-app"
            postgres_container_name="kradnik-prod-postgres"
            postgres_db="kradnik_prod"
            postgres_volume_name="kradnik-prod-postgres-data"
            postgres_public_port="5434"
            metabase_container_name="kradnik-prod-metabase"
            metabase_volume_name="kradnik-prod-metabase-data"
            metabase_public_port="3001"
            telegram_bot_api_container_name="kradnik-prod-telegram-bot-api"
            youtube_po_token_provider_container_name="kradnik-prod-youtube-pot-provider"
            telegram_bot_api_data_volume_name="kradnik-prod-telegram-bot-api-data"
            media_work_volume_name="kradnik-prod-media-work"
          else
            app_environment="test"
            app_container_name="kradnik-test-app"
            postgres_container_name="kradnik-test-postgres"
            postgres_db="kradnik_test"
            postgres_volume_name="kradnik-test-postgres-data"
            postgres_public_port="5433"
            metabase_container_name="kradnik-test-metabase"
            metabase_volume_name="kradnik-test-metabase-data"
            metabase_public_port="3000"
            telegram_bot_api_container_name="kradnik-test-telegram-bot-api"
            youtube_po_token_provider_container_name="kradnik-test-youtube-pot-provider"
            telegram_bot_api_data_volume_name="kradnik-test-telegram-bot-api-data"
            media_work_volume_name="kradnik-test-media-work"
          fi
          {
            printf 'APP_IMAGE=%s\n' "$app_image"
            printf 'APP_ENV=%s\n' "$app_environment"
            printf 'APP_CONTAINER_NAME=%s\n' "$app_container_name"
            printf 'POSTGRES_CONTAINER_NAME=%s\n' "$postgres_container_name"
            printf 'POSTGRES_DB=%s\n' "$postgres_db"
            printf 'POSTGRES_USER=kradnik\n'
            printf 'POSTGRES_PASSWORD=%s\n' "$POSTGRES_PASSWORD"
            printf 'POSTGRES_VOLUME_NAME=%s\n' "$postgres_volume_name"
            printf 'POSTGRES_PUBLIC_PORT=%s\n' "$postgres_public_port"
            printf 'METABASE_CONTAINER_NAME=%s\n' "$metabase_container_name"
            printf 'METABASE_VOLUME_NAME=%s\n' "$metabase_volume_name"
            printf 'METABASE_PUBLIC_PORT=%s\n' "$metabase_public_port"
            printf 'METABASE_ANALYTICS_DB_PASSWORD=%s\n' "$metabase_analytics_db_password"
            printf 'TELEGRAM_BOT_TOKEN=%s\n' "$TELEGRAM_BOT_TOKEN"
            printf 'TELEGRAM_BOT_API_IMAGE=%s\n' "$TELEGRAM_BOT_API_IMAGE"
            printf 'YOUTUBE_PO_TOKEN_PROVIDER_IMAGE=%s\n' "$YOUTUBE_PO_TOKEN_PROVIDER_IMAGE"
            printf 'TELEGRAM_BOT_API_CONTAINER_NAME=%s\n' "$telegram_bot_api_container_name"
            printf 'TELEGRAM_BOT_API_DATA_VOLUME_NAME=%s\n' "$telegram_bot_api_data_volume_name"
            printf 'MEDIA_WORK_VOLUME_NAME=%s\n' "$media_work_volume_name"
            printf 'TELEGRAM_API_ID=%s\n' "$TELEGRAM_API_ID"
            printf 'TELEGRAM_API_HASH=%s\n' "$TELEGRAM_API_HASH"
            printf 'TELEGRAM_LOCAL_API_ENABLED=%s\n' "$telegram_local_api_enabled"
            printf 'YOUTUBE_PO_TOKEN_PROVIDER_ENABLED=%s\n' "$youtube_po_token_provider_enabled"
            printf 'YOUTUBE_PO_TOKEN_PROVIDER_URL=%s\n' "$youtube_po_token_provider_url"
            printf 'YOUTUBE_PO_TOKEN_PROVIDER_CONTAINER_NAME=%s\n' "$youtube_po_token_provider_container_name"
            printf 'TELEGRAM_BOT_API_URL=%s\n' "$telegram_bot_api_url"
            printf 'TELEGRAM_BOT_FILE_API_URL=%s\n' "$telegram_bot_file_api_url"
            printf 'TELEGRAM_MAX_UPLOAD_BYTES=%s\n' "$telegram_max_upload_bytes"
            printf 'TELEGRAM_CONNECT_TIMEOUT=%s\n' "$TELEGRAM_CONNECT_TIMEOUT"
            printf 'TELEGRAM_REQUEST_TIMEOUT=%s\n' "$TELEGRAM_REQUEST_TIMEOUT"
            printf 'DOWNLOAD_WORK_DIR=%s\n' "$download_work_dir"
            printf 'DOWNLOAD_WORK_DIR_RESERVE_BYTES=%s\n' "$DOWNLOAD_WORK_DIR_RESERVE_BYTES"
            printf 'DOWNLOAD_YT_DLP_METADATA_TIMEOUT=%s\n' "$DOWNLOAD_YT_DLP_METADATA_TIMEOUT"
            printf 'DOWNLOAD_YT_DLP_DOWNLOAD_TIMEOUT=%s\n' "$DOWNLOAD_YT_DLP_DOWNLOAD_TIMEOUT"
            printf 'DOWNLOAD_INSTAGRAM_METADATA_TIMEOUT=%s\n' "$DOWNLOAD_INSTAGRAM_METADATA_TIMEOUT"
            printf 'DOWNLOAD_INSTAGRAM_DOWNLOAD_TIMEOUT=%s\n' "$DOWNLOAD_INSTAGRAM_DOWNLOAD_TIMEOUT"
            printf 'DOWNLOAD_VIDEO_FFMPEG_TIMEOUT=%s\n' "$DOWNLOAD_VIDEO_FFMPEG_TIMEOUT"
            printf 'TELEGRAM_DONATION_URL=%s\n' "${TELEGRAM_DONATION_URL:-https://pay.cloudtips.ru/p/6f779a3d}"
            printf 'TELEGRAM_DONATION_CHANNEL_ID=%s\n' "${TELEGRAM_DONATION_CHANNEL_ID:-@mediakradnik}"
            printf 'TELEGRAM_DONATION_PIN_ENABLED=%s\n' "${TELEGRAM_DONATION_PIN_ENABLED:-false}"
            printf 'TELEGRAM_DONATION_PIN_MESSAGE_ID=%s\n' "${TELEGRAM_DONATION_PIN_MESSAGE_ID:-}"
            printf 'DOWNLOAD_PLATFORM_YOUTUBE_ENABLED=%s\n' "${DOWNLOAD_PLATFORM_YOUTUBE_ENABLED:-false}"
            printf 'DOWNLOAD_PLATFORM_INSTAGRAM_ENABLED=%s\n' "${DOWNLOAD_PLATFORM_INSTAGRAM_ENABLED:-false}"
            printf 'DOWNLOAD_PLATFORM_VK_ENABLED=%s\n' "${DOWNLOAD_PLATFORM_VK_ENABLED:-false}"
          } | ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" "cat > '$DEPLOY_PATH/.env'"

      - name: Login to GHCR on server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s\n' "$GHCR_TOKEN" \
            | ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" "docker login ghcr.io -u '$GHCR_USER' --password-stdin"

      - name: Drop Docker state and deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_PATH"
          test "$DEPLOY_PATH" != "/"
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" "\
            cd '$DEPLOY_PATH' && \
            docker compose --profile analytics --profile telegram-local --profile youtube-pot down --volumes --rmi all --remove-orphans && \
            rm -f .metabase-enabled && \
            profiles='' && \
            if [ \"\$(sed -n 's/^TELEGRAM_LOCAL_API_ENABLED=//p' .env)\" = 'true' ]; then profiles='telegram-local'; fi && \
            if [ \"\$(sed -n 's/^YOUTUBE_PO_TOKEN_PROVIDER_ENABLED=//p' .env)\" = 'true' ]; then \
              if [ -n \"\$profiles\" ]; then profiles=\"\$profiles,youtube-pot\"; else profiles='youtube-pot'; fi; \
            fi && \
            if [ -n \"\$profiles\" ]; then export COMPOSE_PROFILES=\"\$profiles\"; else unset COMPOSE_PROFILES; fi && \
            docker compose pull app && \
            if [ \"\$(sed -n 's/^TELEGRAM_LOCAL_API_ENABLED=//p' .env)\" = 'true' ]; then docker compose pull telegram-bot-api; fi && \
            if [ \"\$(sed -n 's/^YOUTUBE_PO_TOKEN_PROVIDER_ENABLED=//p' .env)\" = 'true' ]; then docker compose pull youtube-pot-provider; fi && \
            docker compose up -d --remove-orphans && \
            docker compose ps && \
            test \"\$(docker compose ps -q app | xargs docker inspect -f '{{.State.Status}}')\" = running && \
            if [ \"\$(sed -n 's/^YOUTUBE_PO_TOKEN_PROVIDER_ENABLED=//p' .env)\" = 'true' ]; then \
              youtube_pot_container=\$(docker compose ps -q youtube-pot-provider); \
              test -n \"\$youtube_pot_container\"; \
              test \"\$(docker inspect -f '{{.State.Health.Status}}' \"\$youtube_pot_container\")\" = healthy; \
            fi && \
            docker compose exec -T postgres sh -c 'printf \"%s\n\" \"ALTER ROLE kradnik_analytics_reader WITH LOGIN PASSWORD :'\\''analytics_password'\\'';\" | PGPASSWORD=\"\$POSTGRES_PASSWORD\" psql -U \"\$POSTGRES_USER\" -d \"\$POSTGRES_DB\" -v analytics_password=\"\$METABASE_ANALYTICS_DB_PASSWORD\"' && \
            docker image prune -f\
          "
