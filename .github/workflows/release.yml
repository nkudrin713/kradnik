name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Explicit version, for example v1.4.0. Leave empty to auto-increment."
        required: false
        type: string
      bump:
        description: "Version bump when version is empty"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major
      description:
        description: "Release description"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    name: Create release tag
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      packages: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      target_sha: ${{ steps.version.outputs.target_sha }}
      image_digest: ${{ steps.image.outputs.digest }}

    steps:
      - name: Validate release target
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"

      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Validate release input
        env:
          BUMP: ${{ inputs.bump }}
          DESCRIPTION: ${{ inputs.description }}
        run: |
          set -euo pipefail
          test -n "$DESCRIPTION"
          case "$BUMP" in
            patch|minor|major) ;;
            *) echo "Version bump must be one of: patch, minor, major" >&2; exit 1 ;;
          esac

      - name: Calculate version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          set -euo pipefail
          git fetch --force --tags origin main:refs/remotes/origin/main

          target_sha="$(git rev-parse HEAD)"
          remote_main_sha="$(git rev-parse origin/main)"
          if [ "$target_sha" != "$remote_main_sha" ]; then
            echo "Release target is not the latest main commit" >&2
            echo "HEAD:        $target_sha" >&2
            echo "origin/main: $remote_main_sha" >&2
            exit 1
          fi

          existing_target_tag="$(git tag --points-at "$target_sha" --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)"
          if [ -n "$VERSION_INPUT" ]; then
            if ! printf '%s\n' "$VERSION_INPUT" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "Version must match: v<major>.<minor>.<patch>" >&2
              exit 1
            fi
            next_version="$VERSION_INPUT"
          elif [ -n "$existing_target_tag" ]; then
            next_version="$existing_target_tag"
          else
            latest_tag="$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)"
            if [ -z "$latest_tag" ]; then
              major=0
              minor=0
              patch=0
            else
              version="${latest_tag#v}"
              major="${version%%.*}"
              rest="${version#*.}"
              minor="${rest%%.*}"
              patch="${rest#*.}"
            fi

            case "$BUMP" in
              patch)
                patch=$((patch + 1))
                ;;
              minor)
                minor=$((minor + 1))
                patch=0
                ;;
              major)
                major=$((major + 1))
                minor=0
                patch=0
                ;;
            esac
            next_version="v${major}.${minor}.${patch}"
          fi

          tag_exists=false
          if git rev-parse -q --verify "refs/tags/$next_version" >/dev/null; then
            tag_exists=true
            tag_sha="$(git rev-list -n 1 "$next_version")"
            if [ "$tag_sha" != "$target_sha" ]; then
              echo "Tag $next_version already points to $tag_sha, not $target_sha" >&2
              exit 1
            fi
          fi

          {
            printf 'version=%s\n' "$next_version"
            printf 'target_sha=%s\n' "$target_sha"
            printf 'tag_exists=%s\n' "$tag_exists"
          } >> "$GITHUB_OUTPUT"

      - name: Verify successful test deploy
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.version.outputs.target_sha }}
        run: |
          set -euo pipefail
          run_count="$(
            gh api --method GET \
              "repos/$GITHUB_REPOSITORY/actions/workflows/deploy.yml/runs" \
              -f branch=main \
              -f event=push \
              -f status=success \
              -f head_sha="$TARGET_SHA" \
              -f per_page=1 \
              --jq '.total_count'
          )"
          if [ "$run_count" -lt 1 ]; then
            echo "No successful main test deploy found for $TARGET_SHA" >&2
            exit 1
          fi

      - name: Set image name
        run: |
          set -euo pipefail
          echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Promote tested image
        id: image
        env:
          TARGET_SHA: ${{ steps.version.outputs.target_sha }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          source_image="$IMAGE_NAME:$TARGET_SHA"
          release_image="$IMAGE_NAME:$VERSION"
          source_digest="sha256:$(docker buildx imagetools inspect "$source_image" --raw | sha256sum | cut -d' ' -f1)"
          if ! printf '%s\n' "$source_digest" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
            echo "Could not resolve tested image digest for $source_image" >&2
            exit 1
          fi

          if docker buildx imagetools inspect "$release_image" >/dev/null 2>&1; then
            release_digest="sha256:$(docker buildx imagetools inspect "$release_image" --raw | sha256sum | cut -d' ' -f1)"
          else
            docker buildx imagetools create \
              --prefer-index=false \
              --tag "$release_image" \
              "$IMAGE_NAME@$source_digest"
            release_digest="sha256:$(docker buildx imagetools inspect "$release_image" --raw | sha256sum | cut -d' ' -f1)"
          fi

          if [ "$release_digest" != "$source_digest" ]; then
            echo "$release_image does not match tested digest $source_digest" >&2
            echo "Release digest: $release_digest" >&2
            exit 1
          fi

          echo "digest=$release_digest" >> "$GITHUB_OUTPUT"
          echo "Promoted $source_image to $release_image at $release_digest"

      - name: Create or verify tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
          DESCRIPTION: ${{ inputs.description }}
          TAG_EXISTS: ${{ steps.version.outputs.tag_exists }}
        run: |
          set -euo pipefail
          if [ "$TAG_EXISTS" = "true" ]; then
            echo "Tag already exists on this commit: $VERSION"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "$VERSION $DESCRIPTION"
          git push origin "refs/tags/$VERSION"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          DESCRIPTION: ${{ inputs.description }}
          TARGET_SHA: ${{ steps.version.outputs.target_sha }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          notes="$(printf 'Image: ghcr.io/%s:%s\nDigest: %s\nCommit: %s\n' "${GITHUB_REPOSITORY,,}" "$VERSION" "$IMAGE_DIGEST" "$TARGET_SHA")"
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release edit "$VERSION" \
              --title "$VERSION $DESCRIPTION" \
              --notes "$notes" \
              --latest
          else
            gh release create "$VERSION" \
              --title "$VERSION $DESCRIPTION" \
              --notes "$notes" \
              --latest
          fi

  deploy-production:
    name: Deploy release to production
    needs: release
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
      version: ${{ needs.release.outputs.version }}
    secrets: inherit
