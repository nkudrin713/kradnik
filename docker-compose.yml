services:
  app:
    image: ${APP_IMAGE:?APP_IMAGE is required}
    container_name: ${APP_CONTAINER_NAME:-kradnik-app}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:?APP_ENV is required}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-kradnik}
      POSTGRES_USER: ${POSTGRES_USER:-kradnik}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kradnik}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_DONATION_URL: ${TELEGRAM_DONATION_URL:-https://pay.cloudtips.ru/p/6f779a3d}
      TELEGRAM_DONATION_CHANNEL_ID: ${TELEGRAM_DONATION_CHANNEL_ID:-@mediakradnik}
      TELEGRAM_DONATION_PIN_ENABLED: ${TELEGRAM_DONATION_PIN_ENABLED:-false}
      TELEGRAM_DONATION_PIN_MESSAGE_ID: ${TELEGRAM_DONATION_PIN_MESSAGE_ID:-}
      DOWNLOAD_PLATFORM_YOUTUBE_ENABLED: ${DOWNLOAD_PLATFORM_YOUTUBE_ENABLED:-false}
      DOWNLOAD_PLATFORM_INSTAGRAM_ENABLED: ${DOWNLOAD_PLATFORM_INSTAGRAM_ENABLED:-false}
      DOWNLOAD_PLATFORM_VK_ENABLED: ${DOWNLOAD_PLATFORM_VK_ENABLED:-false}

  postgres:
    image: postgres:17-alpine
    container_name: ${POSTGRES_CONTAINER_NAME:-kradnik-postgres}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kradnik}
      POSTGRES_USER: ${POSTGRES_USER:-kradnik}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kradnik}
      METABASE_ANALYTICS_DB_PASSWORD: ${METABASE_ANALYTICS_DB_PASSWORD:-kradnik}
    ports:
      - "${POSTGRES_PUBLIC_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  metabase:
    image: metabase/metabase:v0.62.3.5
    profiles: ["analytics"]
    container_name: ${METABASE_CONTAINER_NAME:-kradnik-metabase}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${METABASE_PUBLIC_PORT:?METABASE_PUBLIC_PORT is required}:3000"
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
      MB_SITE_URL: ${METABASE_SITE_URL:?METABASE_SITE_URL is required}
      MB_ENABLE_PUBLIC_SHARING: "false"
    volumes:
      - metabase-data:/metabase-data

volumes:
  postgres-data:
    name: ${POSTGRES_VOLUME_NAME:-kradnik_postgres-data}
  metabase-data:
    name: ${METABASE_VOLUME_NAME:-kradnik_metabase-data}
