services:
  app:
    image: ${APP_IMAGE:?APP_IMAGE is required}
    container_name: ${APP_CONTAINER_NAME:-kradnik-app}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      telegram-bot-api:
        condition: service_healthy
        required: false
      youtube-pot-provider:
        condition: service_healthy
        required: false
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-kradnik}
      POSTGRES_USER: ${POSTGRES_USER:-kradnik}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kradnik}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_BOT_API_URL: ${TELEGRAM_BOT_API_URL:-https://api.telegram.org/bot}
      TELEGRAM_BOT_FILE_API_URL: ${TELEGRAM_BOT_FILE_API_URL:-https://api.telegram.org/file/bot}
      TELEGRAM_MAX_UPLOAD_BYTES: ${TELEGRAM_MAX_UPLOAD_BYTES:-47185920}
      TELEGRAM_CONNECT_TIMEOUT: ${TELEGRAM_CONNECT_TIMEOUT:-10s}
      TELEGRAM_REQUEST_TIMEOUT: ${TELEGRAM_REQUEST_TIMEOUT:-60m}
      DOWNLOAD_WORK_DIR: ${DOWNLOAD_WORK_DIR:-/tmp/kradnik-downloads}
      DOWNLOAD_WORK_DIR_RESERVE_BYTES: ${DOWNLOAD_WORK_DIR_RESERVE_BYTES:-536870912}
      DOWNLOAD_YT_DLP_METADATA_TIMEOUT: ${DOWNLOAD_YT_DLP_METADATA_TIMEOUT:-30s}
      DOWNLOAD_YT_DLP_DOWNLOAD_TIMEOUT: ${DOWNLOAD_YT_DLP_DOWNLOAD_TIMEOUT:-30m}
      DOWNLOAD_INSTAGRAM_METADATA_TIMEOUT: ${DOWNLOAD_INSTAGRAM_METADATA_TIMEOUT:-30s}
      DOWNLOAD_INSTAGRAM_DOWNLOAD_TIMEOUT: ${DOWNLOAD_INSTAGRAM_DOWNLOAD_TIMEOUT:-10m}
      DOWNLOAD_VIDEO_FFMPEG_TIMEOUT: ${DOWNLOAD_VIDEO_FFMPEG_TIMEOUT:-20m}
      DOWNLOAD_CHOICE_SESSION_TTL: ${DOWNLOAD_CHOICE_SESSION_TTL:-30m}
      TELEGRAM_DONATION_URL: ${TELEGRAM_DONATION_URL:-https://pay.cloudtips.ru/p/6f779a3d}
      TELEGRAM_DONATION_CHANNEL_ID: ${TELEGRAM_DONATION_CHANNEL_ID:-@mediakradnik}
      TELEGRAM_DONATION_PIN_ENABLED: ${TELEGRAM_DONATION_PIN_ENABLED:-false}
      TELEGRAM_DONATION_PIN_MESSAGE_ID: ${TELEGRAM_DONATION_PIN_MESSAGE_ID:-}
      YOUTUBE_PO_TOKEN_PROVIDER_URL: ${YOUTUBE_PO_TOKEN_PROVIDER_URL:-}
    volumes:
      - media-work:/var/lib/kradnik/media

  telegram-bot-api:
    image: ${TELEGRAM_BOT_API_IMAGE:-ghcr.io/nkudrin713/kradnik-telegram-bot-api:adfd7f6a8e990272851777eeb3ae0def4216f161}
    profiles: ["telegram-local"]
    container_name: ${TELEGRAM_BOT_API_CONTAINER_NAME:-kradnik-telegram-bot-api}
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:-}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:-}
    volumes:
      - telegram-bot-api-data:/var/lib/telegram-bot-api
      - media-work:/var/lib/kradnik/media:ro
    tmpfs:
      - /tmp/telegram-bot-api:size=64m,mode=0700,uid=101,gid=101
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "8081"]
      interval: 5s
      timeout: 3s
      retries: 12

  youtube-pot-provider:
    image: ${YOUTUBE_PO_TOKEN_PROVIDER_IMAGE:-brainicism/bgutil-ytdlp-pot-provider:1.3.2-deno}
    profiles: ["youtube-pot"]
    container_name: ${YOUTUBE_PO_TOKEN_PROVIDER_CONTAINER_NAME:-kradnik-youtube-pot-provider}
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "deno",
          "eval",
          "--no-config",
          "const connection = await Deno.connect({ hostname: '127.0.0.1', port: 4416 }); connection.close();",
        ]
      interval: 5s
      timeout: 3s
      retries: 12

  postgres:
    image: postgres:17-alpine
    container_name: ${POSTGRES_CONTAINER_NAME:-kradnik-postgres}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kradnik}
      POSTGRES_USER: ${POSTGRES_USER:-kradnik}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kradnik}
    ports:
      - "${POSTGRES_PUBLIC_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
    name: ${POSTGRES_VOLUME_NAME:-kradnik_postgres-data}
  telegram-bot-api-data:
    name: ${TELEGRAM_BOT_API_DATA_VOLUME_NAME:-kradnik_telegram-bot-api-data}
  media-work:
    name: ${MEDIA_WORK_VOLUME_NAME:-kradnik_media-work}
