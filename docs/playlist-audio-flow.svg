<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="960" viewBox="0 0 1280 960" role="img" aria-labelledby="title description">
<title id="title">YouTube playlist · audio messages</title>
<desc id="description">A playlist worker starts PlaylistJobProcessor and AudioMessagesPlaylistWorkflow. The workflow skips recorded positions, reuses cached audio or downloads and stages new tracks, records each outcome, then sends successful tracks in playlist order. Conditional completion precedes the partial-success summary.</desc>
<defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <style>
      .title { font: 700 26px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .stage { font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .name { font: 600 15px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #0f172a; }
      .note { font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .small { font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .box { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.5; rx: 10; }
      .store { fill: #eff6ff; stroke: #3b82f6; stroke-width: 1.5; rx: 10; }
      .external { fill: #f0fdf4; stroke: #22c55e; stroke-width: 1.5; rx: 10; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 14; }
      .arrow { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrow); }
      .divider { stroke: #cbd5e1; stroke-width: 1.5; }
    </style>
  </defs>
<rect width="1280" height="960" fill="#ffffff"/>
<text x="40" y="44" class="title">YouTube playlist · audio messages</text>
<text x="40" y="72" class="note">Recorded item results survive restart. Downloads are staged before ordered delivery.</text>
<text x="40" y="113" class="stage">YouTubePlaylistPlanner → saved track range + AUDIO_MESSAGES → persisted queue</text>
<rect x="40" y="143" width="340" height="92" class="box"/>
<text x="210.0" y="173" class="name" text-anchor="middle">PlaylistQueueWorker</text>
<text x="210.0" y="200" class="small" text-anchor="middle">claim a queued playlist job</text>
<rect x="470" y="143" width="340" height="92" class="box"/>
<text x="640.0" y="173" class="name" text-anchor="middle">PlaylistJobProcessor</text>
<text x="640.0" y="200" class="small" text-anchor="middle">map PlaylistAudioRequest; create workspace</text>
<rect x="900" y="143" width="340" height="92" class="box"/>
<text x="1070.0" y="173" class="name" text-anchor="middle">AudioMessagesPlaylistWorkflow</text>
<text x="1070.0" y="200" class="small" text-anchor="middle">skip all recorded positions</text>
<path d="M 380 189 H 470" class="arrow"/>
<path d="M 810 189 H 900" class="arrow"/>
<path d="M 1070 235 V 272" class="arrow"/>
<rect x="40" y="272" width="1200" height="347" class="panel"/>
<text x="65" y="308" class="stage">Each pending entry · bounded parallelism</text>
<text x="65" y="337" class="note">Recorded successes and failures are skipped on resume. Cancellation propagates without recording a failure.</text>
<path d="M 207 413 V 378 H 1075 V 413" class="arrow"/>
<text x="640" y="369" class="small" text-anchor="middle">cache hit: reuse file ID</text>
<rect x="65" y="413" width="285" height="116" class="store"/>
<text x="207.5" y="443" class="name" text-anchor="middle">TelegramResultCache</text>
<text x="207.5" y="470" class="small" text-anchor="middle">lookup the track’s audio key</text>
<text x="207.5" y="494" class="small" text-anchor="middle">shared with single-audio identity</text>
<rect x="495" y="413" width="285" height="116" class="box"/>
<text x="637.5" y="443" class="name" text-anchor="middle">PlaylistEntryDownloader</text>
<text x="637.5" y="470" class="small" text-anchor="middle">yt-dlp → 96 kbps MP3</text>
<text x="637.5" y="494" class="small" text-anchor="middle">stagePlaylistAudio → storage chat</text>
<rect x="930" y="413" width="285" height="116" class="store"/>
<text x="1072.5" y="443" class="name" text-anchor="middle">DownloadJobService</text>
<text x="1072.5" y="470" class="small" text-anchor="middle">savePlaylistResult</text>
<text x="1072.5" y="494" class="small" text-anchor="middle">file ID or per-entry error</text>
<path d="M 350 471 H 495" class="arrow"/>
<text x="422" y="456" class="small" text-anchor="middle">cache miss</text>
<path d="M 780 471 H 930" class="arrow"/>
<text x="855" y="456" class="small" text-anchor="middle">save outcome</text>
<text x="65" y="568" class="note">A new track is uploaded with TelegramPlaylistSender before its success is saved.</text>
<text x="65" y="594" class="note">Item directories are deleted in finally after staging or failure; other entries continue after item errors.</text>
<path d="M 1075 619 V 653 H 210 V 689" class="arrow"/>
<text x="640" y="646" class="small" text-anchor="middle">wait for all pending entries</text>
<rect x="40" y="689" width="340" height="116" class="store"/>
<text x="210.0" y="719" class="name" text-anchor="middle">Reload saved results</text>
<text x="210.0" y="746" class="small" text-anchor="middle">require PROCESSING and ≥ 1 success</text>
<text x="210.0" y="770" class="small" text-anchor="middle">no successes → fail the job</text>
<rect x="470" y="689" width="340" height="116" class="external"/>
<text x="640.0" y="719" class="name" text-anchor="middle">TelegramPlaylistSender</text>
<text x="640.0" y="746" class="small" text-anchor="middle">sendPlaylistAudios sorts by position</text>
<text x="640.0" y="770" class="small" text-anchor="middle">up to 50 tracks per Rich Message</text>
<rect x="900" y="689" width="340" height="116" class="box"/>
<text x="1070.0" y="719" class="name" text-anchor="middle">JobLifecycle.complete</text>
<text x="1070.0" y="746" class="small" text-anchor="middle">conditional transition to COMPLETED</text>
<text x="1070.0" y="770" class="small" text-anchor="middle">then summary if any entries failed</text>
<path d="M 380 747 H 470" class="arrow"/>
<path d="M 810 747 H 900" class="arrow"/>
<text x="40" y="857" class="note">If cancellation wins, completion and the summary are suppressed. Delivery errors fail the job.</text>
<text x="40" y="885" class="note">PlaylistJobProcessor cleans the job workspace in finally. Restart resumes entries without a saved outcome.</text>
<text x="40" y="923" class="note">Requires the configured Telegram storage chat for staging fresh audio tracks.</text>
</svg>
