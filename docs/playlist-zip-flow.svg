<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="680" viewBox="0 0 1120 680" role="img" aria-labelledby="title description">
  <title id="title">YouTube playlist · ZIP archive</title>
  <desc id="description">Queued playlist processing, bounded local downloads, validation, archive creation, upload, completion, and cleanup. Details are in the README.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <style>
      text { font: 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .title { font-size: 26px; font-weight: 700; }
      .stage { font-size: 20px; font-weight: 600; fill: #334155; }
      .box { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.5; }
      .store { fill: #eff6ff; stroke: #3b82f6; stroke-width: 1.5; }
      .external { fill: #f0fdf4; stroke: #22c55e; stroke-width: 1.5; }
      .arrow { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrow); }
    </style>
  </defs>
