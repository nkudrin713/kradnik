<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title description">
  <title id="title">Kradnik request flow</title>
  <desc id="description">Two-stage interaction diagram covering metadata and menu creation, then queued download and Telegram delivery.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <style>
      .title { font: 700 24px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .stage { font: 700 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .name { font: 600 15px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #0f172a; }
      .note { font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .box { fill: #f8fafc; stroke: #94a3b8; stroke-width: 2; rx: 10; }
      .store { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2; rx: 10; }
      .external { fill: #f0fdf4; stroke: #22c55e; stroke-width: 2; rx: 10; }
      .arrow { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrow); }
      .divider { stroke: #cbd5e1; stroke-width: 2; stroke-dasharray: 7 7; }
    </style>
  </defs>

  <rect width="1280" height="720" fill="#ffffff"/>
  <text x="40" y="45" class="title">Kradnik request flow</text>

  <text x="40" y="92" class="stage">1. Build and show the download menu</text>

  <rect x="40" y="120" width="200" height="72" class="external"/>
  <text x="140" y="150" text-anchor="middle" class="name">Telegram</text>
  <text x="140" y="174" text-anchor="middle" class="note">link or inline query</text>

  <rect x="290" y="120" width="220" height="72" class="box"/>
  <text x="400" y="150" text-anchor="middle" class="name">TelegramUpdateHandler</text>
  <text x="400" y="174" text-anchor="middle" class="note">validate update</text>

  <rect x="560" y="120" width="230" height="72" class="box"/>
  <text x="675" y="150" text-anchor="middle" class="name">DownloadChoiceCoordinator</text>
  <text x="675" y="174" text-anchor="middle" class="note">bounded metadata task</text>

  <rect x="840" y="120" width="200" height="72" class="box"/>
  <text x="940" y="150" text-anchor="middle" class="name">DownloadChoicePlanner</text>
  <text x="940" y="174" text-anchor="middle" class="note">build menu options</text>

  <rect x="1090" y="120" width="150" height="72" class="box"/>
  <text x="1165" y="150" text-anchor="middle" class="name">DownloadEngine</text>
  <text x="1165" y="174" text-anchor="middle" class="note">read metadata</text>

  <path d="M 240 156 H 290" class="arrow"/>
  <path d="M 510 156 H 560" class="arrow"/>
  <path d="M 790 156 H 840" class="arrow"/>
  <path d="M 1040 156 H 1090" class="arrow"/>

  <rect x="840" y="230" width="200" height="72" class="store"/>
  <text x="940" y="260" text-anchor="middle" class="name">PostgreSQL</text>
  <text x="940" y="284" text-anchor="middle" class="note">choice session</text>
  <path d="M 940 192 V 230" class="arrow"/>
  <path d="M 840 266 H 140 V 192" class="arrow"/>
  <text x="470" y="253" text-anchor="middle" class="note">persist menu, then send choices</text>

  <line x1="40" y1="350" x2="1240" y2="350" class="divider"/>
  <text x="40" y="397" class="stage">2. Queue, download, and deliver the selected media</text>

  <rect x="40" y="425" width="210" height="72" class="box"/>
  <text x="145" y="455" text-anchor="middle" class="name">DownloadChoiceHandler</text>
  <text x="145" y="479" text-anchor="middle" class="note">accept selection</text>

  <rect x="300" y="425" width="210" height="72" class="box"/>
  <text x="405" y="455" text-anchor="middle" class="name">TelegramDownloadStarter</text>
  <text x="405" y="479" text-anchor="middle" class="note">create job</text>

  <rect x="560" y="425" width="190" height="72" class="store"/>
  <text x="655" y="455" text-anchor="middle" class="name">DownloadJobService</text>
  <text x="655" y="479" text-anchor="middle" class="note">QUEUED in PostgreSQL</text>

  <path d="M 250 461 H 300" class="arrow"/>
  <path d="M 510 461 H 560" class="arrow"/>

  <rect x="40" y="560" width="210" height="72" class="box"/>
  <text x="145" y="590" text-anchor="middle" class="name">DownloadQueueWorker</text>
  <text x="145" y="614" text-anchor="middle" class="note">claim next job</text>

  <rect x="300" y="560" width="210" height="72" class="box"/>
  <text x="405" y="590" text-anchor="middle" class="name">DownloadJobProcessor</text>
  <text x="405" y="614" text-anchor="middle" class="note">orchestrate and clean up</text>

  <rect x="560" y="560" width="190" height="72" class="box"/>
  <text x="655" y="590" text-anchor="middle" class="name">DownloadEngine</text>
  <text x="655" y="614" text-anchor="middle" class="note">download media</text>

  <rect x="800" y="560" width="190" height="72" class="box"/>
  <text x="895" y="590" text-anchor="middle" class="name">TelegramFileSender</text>
  <text x="895" y="614" text-anchor="middle" class="note">upload or reuse file_id</text>

  <rect x="1040" y="560" width="200" height="72" class="external"/>
  <text x="1140" y="590" text-anchor="middle" class="name">Telegram Bot API</text>
  <text x="1140" y="614" text-anchor="middle" class="note">deliver media</text>

  <path d="M 655 497 V 525 H 145 V 560" class="arrow"/>
  <text x="390" y="520" text-anchor="middle" class="note">atomic claim: PROCESSING</text>
  <path d="M 250 596 H 300" class="arrow"/>
  <path d="M 510 596 H 560" class="arrow"/>
  <path d="M 750 596 H 800" class="arrow"/>
  <path d="M 990 596 H 1040" class="arrow"/>

  <path d="M 1140 632 V 680 H 655 V 497" class="arrow"/>
  <text x="895" y="673" text-anchor="middle" class="note">COMPLETED or FAILED</text>
</svg>
