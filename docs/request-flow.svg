<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="790" viewBox="0 0 1120 790" role="img" aria-labelledby="title description">
  <title id="title">Single-media request flow</title>
  <desc id="description">Menu planning, persisted selection, queued execution, cache lookup, production, and Telegram delivery. Details are in the README.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <style>
      text { font: 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .title { font-size: 26px; font-weight: 700; }
      .stage { font-size: 20px; font-weight: 600; fill: #334155; }
      .box { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.5; }
      .store { fill: #eff6ff; stroke: #3b82f6; stroke-width: 1.5; }
      .external { fill: #f0fdf4; stroke: #22c55e; stroke-width: 1.5; }
      .arrow { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1120" height="790" fill="#ffffff"/>
  <text x="40" y="44" class="title">Single-media request flow</text>
  <text x="40" y="96" class="stage">1. Plan the menu</text>
  <rect x="40.0" y="118" width="236.0" height="76" rx="10" class="external"/>
  <text x="158.0" y="162.0" text-anchor="middle">TelegramUpdateHandler</text>
  <path d="M 276.0 156 H 304.0" class="arrow"/>
  <rect x="308.0" y="118" width="236.0" height="76" rx="10" class="box"/>
  <text x="426.0" y="149.5" text-anchor="middle">DownloadChoice</text>
  <text x="426.0" y="174.5" text-anchor="middle">Coordinator</text>
  <path d="M 544.0 156 H 572.0" class="arrow"/>
  <rect x="576.0" y="118" width="236.0" height="76" rx="10" class="box"/>
  <text x="694.0" y="162.0" text-anchor="middle">DownloadChoicePlanner</text>
  <path d="M 812.0 156 H 840.0" class="arrow"/>
  <rect x="844.0" y="118" width="236.0" height="76" rx="10" class="box"/>
  <text x="962.0" y="162.0" text-anchor="middle">DownloadEngine</text>
  <text x="40" y="245" class="stage">2. Accept the selection</text>
  <rect x="40.0" y="267" width="236.0" height="76" rx="10" class="box"/>
  <text x="158.0" y="311.0" text-anchor="middle">DownloadChoiceHandler</text>
  <path d="M 276.0 305 H 304.0" class="arrow"/>
  <rect x="308.0" y="267" width="236.0" height="76" rx="10" class="box"/>
  <text x="426.0" y="311.0" text-anchor="middle">TelegramDownloadStarter</text>
  <path d="M 544.0 305 H 572.0" class="arrow"/>
  <rect x="576.0" y="267" width="236.0" height="76" rx="10" class="store"/>
  <text x="694.0" y="311.0" text-anchor="middle">DownloadJobService</text>
  <path d="M 812.0 305 H 840.0" class="arrow"/>
  <rect x="844.0" y="267" width="236.0" height="76" rx="10" class="box"/>
  <text x="962.0" y="311.0" text-anchor="middle">DownloadQueueWorker</text>
  <text x="40" y="396" class="stage">3. Process the job · DownloadJobProcessor</text>
  <rect x="40.0" y="463" width="325.3333333333333" height="76" rx="10" class="store"/>
  <text x="202.66666666666666" y="507.0" text-anchor="middle">TelegramResultCache</text>
  <path d="M 365.3333333333333 501 H 393.3333333333333" class="arrow"/>
  <rect x="397.3333333333333" y="463" width="325.3333333333333" height="76" rx="10" class="box"/>
  <text x="560.0" y="507.0" text-anchor="middle">SingleMediaHandler</text>
  <path d="M 722.6666666666666 501 H 750.6666666666666" class="arrow"/>
  <rect x="754.6666666666666" y="463" width="325.3333333333333" height="76" rx="10" class="external"/>
  <text x="917.3333333333333" y="507.0" text-anchor="middle">TelegramFileSender</text>
  <text x="400" y="458" text-anchor="middle">miss</text>
  <path d="M 208 463 V 422 H 912 V 459" class="arrow"/>
  <text x="560" y="414" text-anchor="middle">cache hit</text>
  <text x="40" y="609" class="stage">Processor responsibilities</text>
  <rect x="40.0" y="633" width="325.3333333333333" height="76" rx="10" class="box"/>
  <text x="202.66666666666666" y="677.0" text-anchor="middle">JobLifecycle</text>
  <rect x="397.3333333333333" y="633" width="325.3333333333333" height="76" rx="10" class="box"/>
  <text x="560.0" y="677.0" text-anchor="middle">TelegramJobProgress</text>
  <rect x="754.6666666666666" y="633" width="325.3333333333333" height="76" rx="10" class="box"/>
  <text x="917.3333333333333" y="677.0" text-anchor="middle">WorkDirCleaner</text>
</svg>
