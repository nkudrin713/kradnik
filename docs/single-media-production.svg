<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="850" viewBox="0 0 1280 850" role="img" aria-labelledby="title description">
<title id="title">Single-media production</title>
<desc id="description">Video, audio, cover, and Instagram images use separate handlers. Each prepares source metadata and validates the relevant limits before returning a typed MediaArtifact. Delivery and lifecycle belong to DownloadJobProcessor.</desc>
<defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <style>
      .title { font: 700 26px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .stage { font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .name { font: 600 15px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #0f172a; }
      .note { font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .small { font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .box { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.5; rx: 10; }
      .store { fill: #eff6ff; stroke: #3b82f6; stroke-width: 1.5; rx: 10; }
      .external { fill: #f0fdf4; stroke: #22c55e; stroke-width: 1.5; rx: 10; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 14; }
      .arrow { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrow); }
      .divider { stroke: #cbd5e1; stroke-width: 1.5; }
    </style>
  </defs>
<rect width="1280" height="850" fill="#ffffff"/>
<text x="40" y="44" class="title">Single-media production</text>
<text x="40" y="72" class="note">Cache misses select one handler. Each row is an independent production path.</text>
<text x="40" y="113" class="stage">SingleMediaHandlers selects by OutputType; DownloadEngine selects the source adapter.</text>
<text x="40" y="207" class="name">VideoHandler</text>
<rect x="220" y="148" width="240" height="110" class="box"/>
<text x="340.0" y="178" class="name" text-anchor="middle">Metadata + preflight</text>
<text x="340.0" y="205" class="small" text-anchor="middle">selected source metadata</text>
<text x="340.0" y="229" class="small" text-anchor="middle">DownloadPreflightService</text>
<path d="M 460 203 H 480" class="arrow"/>
<rect x="480" y="148" width="240" height="110" class="box"/>
<text x="600.0" y="178" class="name" text-anchor="middle">Download video</text>
<text x="600.0" y="205" class="small" text-anchor="middle">DownloadEngine</text>
<text x="600.0" y="229" class="small" text-anchor="middle">SourceMediaType.VIDEO</text>
<path d="M 720 203 H 740" class="arrow"/>
<rect x="740" y="148" width="240" height="110" class="box"/>
<text x="860.0" y="178" class="name" text-anchor="middle">Prepare + validate</text>
<text x="860.0" y="205" class="small" text-anchor="middle">TelegramVideoPreparer</text>
<text x="860.0" y="229" class="small" text-anchor="middle">final file-size check</text>
<path d="M 980 203 H 1000" class="arrow"/>
<rect x="1000" y="148" width="240" height="110" class="external"/>
<text x="1120.0" y="178" class="name" text-anchor="middle">MediaArtifact.Video</text>
<text x="1120.0" y="205" class="small" text-anchor="middle">local video path</text>
<text x="40" y="349" class="name">AudioHandler</text>
<rect x="220" y="290" width="240" height="110" class="box"/>
<text x="340.0" y="320" class="name" text-anchor="middle">Metadata + preflight</text>
<text x="340.0" y="347" class="small" text-anchor="middle">estimate audio size</text>
<text x="340.0" y="371" class="small" text-anchor="middle">adjust quality when needed</text>
<path d="M 460 345 H 480" class="arrow"/>
<rect x="480" y="290" width="240" height="110" class="box"/>
<text x="600.0" y="320" class="name" text-anchor="middle">Download audio</text>
<text x="600.0" y="347" class="small" text-anchor="middle">DownloadEngine</text>
<text x="600.0" y="371" class="small" text-anchor="middle">SourceMediaType.AUDIO</text>
<path d="M 720 345 H 740" class="arrow"/>
<rect x="740" y="290" width="240" height="110" class="box"/>
<text x="860.0" y="320" class="name" text-anchor="middle">Validate + metadata</text>
<text x="860.0" y="347" class="small" text-anchor="middle">final file-size check</text>
<text x="860.0" y="371" class="small" text-anchor="middle">title, performer, duration</text>
<path d="M 980 345 H 1000" class="arrow"/>
<rect x="1000" y="290" width="240" height="110" class="external"/>
<text x="1120.0" y="320" class="name" text-anchor="middle">MediaArtifact.Audio</text>
<text x="1120.0" y="347" class="small" text-anchor="middle">local audio + AudioMetadata</text>
<text x="40" y="491" class="name">CoverHandler</text>
<rect x="220" y="432" width="240" height="110" class="box"/>
<text x="340.0" y="462" class="name" text-anchor="middle">Catalog + preflight</text>
<text x="340.0" y="489" class="small" text-anchor="middle">catalog metadata</text>
<text x="340.0" y="513" class="small" text-anchor="middle">require a thumbnail URL</text>
<path d="M 460 487 H 480" class="arrow"/>
<rect x="480" y="432" width="240" height="110" class="box"/>
<text x="600.0" y="462" class="name" text-anchor="middle">Download cover</text>
<text x="600.0" y="489" class="small" text-anchor="middle">CoverDownloader</text>
<text x="600.0" y="513" class="small" text-anchor="middle">thumbnail URL → local file</text>
<path d="M 720 487 H 740" class="arrow"/>
<rect x="740" y="432" width="240" height="110" class="box"/>
<text x="860.0" y="462" class="name" text-anchor="middle">Validate cover</text>
<text x="860.0" y="489" class="small" text-anchor="middle">final file-size check</text>
<path d="M 980 487 H 1000" class="arrow"/>
<rect x="1000" y="432" width="240" height="110" class="external"/>
<text x="1120.0" y="462" class="name" text-anchor="middle">MediaArtifact.Document</text>
<text x="1120.0" y="489" class="small" text-anchor="middle">local cover path</text>
<text x="40" y="633" class="name">ImagesHandler</text>
<rect x="220" y="574" width="240" height="110" class="box"/>
<text x="340.0" y="604" class="name" text-anchor="middle">Metadata + preflight</text>
<text x="340.0" y="631" class="small" text-anchor="middle">Instagram image metadata</text>
<text x="340.0" y="655" class="small" text-anchor="middle">prepare the image list</text>
<path d="M 460 629 H 480" class="arrow"/>
<rect x="480" y="574" width="240" height="110" class="box"/>
<text x="600.0" y="604" class="name" text-anchor="middle">Download images</text>
<text x="600.0" y="631" class="small" text-anchor="middle">InstagramSourceAdapter</text>
<text x="600.0" y="655" class="small" text-anchor="middle">per-photo limits enforced</text>
<path d="M 720 629 H 740" class="arrow"/>
<rect x="740" y="574" width="240" height="110" class="box"/>
<text x="860.0" y="604" class="name" text-anchor="middle">Keep ordered files</text>
<text x="860.0" y="631" class="small" text-anchor="middle">no aggregate single-file</text>
<text x="860.0" y="655" class="small" text-anchor="middle">upload-size check</text>
<path d="M 980 629 H 1000" class="arrow"/>
<rect x="1000" y="574" width="240" height="110" class="external"/>
<text x="1120.0" y="604" class="name" text-anchor="middle">MediaArtifact.Photos</text>
<text x="1120.0" y="631" class="small" text-anchor="middle">ordered local photo paths</text>
<text x="40" y="755" class="note">Sources: yt-dlp for YouTube/VK; Instagram embed metadata with image-metadata fallback.</text>
<text x="40" y="781" class="note">Instagram video uses the direct media URL when available; audio and other video downloads use yt-dlp.</text>
<text x="40" y="814" class="note">DownloadJobProcessor → TelegramFileSender → TelegramMediaSender; full posts add text after media in direct chats.</text>
</svg>
