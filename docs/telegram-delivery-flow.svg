<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-labelledby="title description">
<title id="title">Telegram delivery · direct chat and inline</title>
<desc id="description">Direct chat delivery sends fresh media or cached references, followed by optional post text. Fresh inline delivery stages a file in the storage chat before editing the inline message. Cached inline delivery edits the message directly. Photo groups and full posts are direct-chat only.</desc>
<defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <style>
      .title { font: 700 26px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .stage { font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .name { font: 600 15px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #0f172a; }
      .note { font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .small { font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .box { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.5; rx: 10; }
      .store { fill: #eff6ff; stroke: #3b82f6; stroke-width: 1.5; rx: 10; }
      .external { fill: #f0fdf4; stroke: #22c55e; stroke-width: 1.5; rx: 10; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 14; }
      .arrow { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrow); }
      .divider { stroke: #cbd5e1; stroke-width: 1.5; }
    </style>
  </defs>
<rect width="1280" height="800" fill="#ffffff"/>
<text x="40" y="44" class="title">Telegram delivery · direct chat and inline</text>
<text x="40" y="72" class="note">TelegramFileSender receives DeliveryContext plus MediaArtifact or CachedMedia.</text>
<text x="40" y="115" class="stage">Direct chat</text>
<rect x="40" y="145" width="280" height="100" class="box"/>
<text x="180.0" y="175" class="name" text-anchor="middle">MediaArtifact</text>
<text x="180.0" y="202" class="small" text-anchor="middle">fresh local media</text>
<rect x="390" y="145" width="430" height="100" class="box"/>
<text x="605.0" y="175" class="name" text-anchor="middle">Send media to the user</text>
<text x="605.0" y="202" class="small" text-anchor="middle">sendVideo / sendAudio / sendDocument / sendPhotos</text>
<rect x="890" y="145" width="350" height="100" class="external"/>
<text x="1065.0" y="175" class="name" text-anchor="middle">Optional post text</text>
<text x="1065.0" y="202" class="small" text-anchor="middle">sendMonospaceText after media</text>
<path d="M 320 195 H 390" class="arrow"/>
<path d="M 820 195 H 890" class="arrow"/>
<rect x="40" y="280" width="280" height="100" class="store"/>
<text x="180.0" y="310" class="name" text-anchor="middle">CachedMedia</text>
<text x="180.0" y="337" class="small" text-anchor="middle">typed Telegram references</text>
<rect x="390" y="280" width="430" height="100" class="box"/>
<text x="605.0" y="310" class="name" text-anchor="middle">Reuse Telegram file IDs</text>
<text x="605.0" y="337" class="small" text-anchor="middle">sendCachedVideo / Audio / Document / Photos</text>
<rect x="890" y="280" width="350" height="100" class="external"/>
<text x="1065.0" y="310" class="name" text-anchor="middle">Optional post text</text>
<text x="1065.0" y="337" class="small" text-anchor="middle">taken from the current DeliveryContext</text>
<path d="M 320 330 H 390" class="arrow"/>
<path d="M 820 330 H 890" class="arrow"/>
<text x="40" y="427" class="stage">Inline guest mode</text>
<rect x="40" y="457" width="280" height="100" class="box"/>
<text x="180.0" y="487" class="name" text-anchor="middle">MediaArtifact</text>
<text x="180.0" y="514" class="small" text-anchor="middle">video, audio, or document</text>
<rect x="390" y="457" width="430" height="100" class="box"/>
<text x="605.0" y="487" class="name" text-anchor="middle">Upload to the storage chat</text>
<text x="605.0" y="514" class="small" text-anchor="middle">configured fileStorageChatId is required</text>
<rect x="890" y="457" width="350" height="100" class="external"/>
<text x="1065.0" y="487" class="name" text-anchor="middle">Edit the inline message</text>
<text x="1065.0" y="514" class="small" text-anchor="middle">editInlineVideo / Audio / Document</text>
<path d="M 320 507 H 390" class="arrow"/>
<path d="M 820 507 H 890" class="arrow"/>
<rect x="40" y="592" width="280" height="100" class="store"/>
<text x="180.0" y="622" class="name" text-anchor="middle">CachedMedia.Single</text>
<text x="180.0" y="649" class="small" text-anchor="middle">video, audio, or document</text>
<rect x="390" y="592" width="430" height="100" class="box"/>
<text x="605.0" y="622" class="name" text-anchor="middle">Use the saved Telegram file ID</text>
<text x="605.0" y="649" class="small" text-anchor="middle">no staging upload</text>
<rect x="890" y="592" width="350" height="100" class="external"/>
<text x="1065.0" y="622" class="name" text-anchor="middle">Edit the inline message</text>
<text x="1065.0" y="649" class="small" text-anchor="middle">editInlineVideo / Audio / Document</text>
<path d="M 320 642 H 390" class="arrow"/>
<path d="M 820 642 H 890" class="arrow"/>
<text x="40" y="742" class="note">Photo groups and full Instagram posts are direct-chat only. Full-post text is sent separately after successful media delivery.</text>
<text x="40" y="772" class="note">TelegramMediaSender performs API calls. The returned receipt is persisted only when JobLifecycle.complete succeeds.</text>
</svg>
