<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="610" viewBox="0 0 1120 610" role="img" aria-labelledby="title description">
  <title id="title">Telegram delivery</title>
  <desc id="description">Fresh and cached media delivery in direct chats and inline guest mode. Delivery contracts are described in the README.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <style>
      text { font: 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .title { font-size: 26px; font-weight: 700; }
      .stage { font-size: 20px; font-weight: 600; fill: #334155; }
      .box { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.5; }
      .store { fill: #eff6ff; stroke: #3b82f6; stroke-width: 1.5; }
      .external { fill: #f0fdf4; stroke: #22c55e; stroke-width: 1.5; }
      .arrow { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1120" height="610" fill="#ffffff"/>
  <text x="40" y="44" class="title">Telegram delivery</text>
  <text x="40" y="100" class="stage">Direct chat</text>
  <rect x="40.0" y="125" width="325.3333333333333" height="76" rx="10" class="box"/>
  <text x="202.66666666666666" y="169.0" text-anchor="middle">MediaArtifact</text>
  <path d="M 365.3333333333333 163 H 393.3333333333333" class="arrow"/>
  <rect x="397.3333333333333" y="125" width="325.3333333333333" height="76" rx="10" class="box"/>
  <text x="560.0" y="169.0" text-anchor="middle">Send to the user</text>
  <path d="M 722.6666666666666 163 H 750.6666666666666" class="arrow"/>
  <rect x="754.6666666666666" y="125" width="325.3333333333333" height="76" rx="10" class="external"/>
  <text x="917.3333333333333" y="169.0" text-anchor="middle">Delivery receipt</text>
  <rect x="40.0" y="230" width="325.3333333333333" height="76" rx="10" class="store"/>
  <text x="202.66666666666666" y="274.0" text-anchor="middle">CachedMedia</text>
  <path d="M 365.3333333333333 268 H 393.3333333333333" class="arrow"/>
  <rect x="397.3333333333333" y="230" width="325.3333333333333" height="76" rx="10" class="box"/>
  <text x="560.0" y="274.0" text-anchor="middle">Reuse Telegram file IDs</text>
  <path d="M 722.6666666666666 268 H 750.6666666666666" class="arrow"/>
  <rect x="754.6666666666666" y="230" width="325.3333333333333" height="76" rx="10" class="external"/>
  <text x="917.3333333333333" y="274.0" text-anchor="middle">Delivery receipt</text>
  <text x="40" y="365" class="stage">Inline guest mode</text>
  <rect x="40.0" y="390" width="325.3333333333333" height="76" rx="10" class="box"/>
  <text x="202.66666666666666" y="434.0" text-anchor="middle">MediaArtifact</text>
  <path d="M 365.3333333333333 428 H 393.3333333333333" class="arrow"/>
  <rect x="397.3333333333333" y="390" width="325.3333333333333" height="76" rx="10" class="store"/>
  <text x="560.0" y="434.0" text-anchor="middle">Upload to storage chat</text>
  <path d="M 722.6666666666666 428 H 750.6666666666666" class="arrow"/>
  <rect x="754.6666666666666" y="390" width="325.3333333333333" height="76" rx="10" class="external"/>
  <text x="917.3333333333333" y="434.0" text-anchor="middle">Edit inline message</text>
  <rect x="40.0" y="495" width="325.3333333333333" height="76" rx="10" class="store"/>
  <text x="202.66666666666666" y="539.0" text-anchor="middle">CachedMedia.Single</text>
  <path d="M 365.3333333333333 533 H 393.3333333333333" class="arrow"/>
  <rect x="397.3333333333333" y="495" width="325.3333333333333" height="76" rx="10" class="box"/>
  <text x="560.0" y="539.0" text-anchor="middle">Reuse Telegram file ID</text>
  <path d="M 722.6666666666666 533 H 750.6666666666666" class="arrow"/>
  <rect x="754.6666666666666" y="495" width="325.3333333333333" height="76" rx="10" class="external"/>
  <text x="917.3333333333333" y="539.0" text-anchor="middle">Edit inline message</text>
</svg>
