spring.application.name=kradnik
app.environment=${APP_ENV}

spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:postgres}:${POSTGRES_PORT:5432}/${POSTGRES_DB:kradnik}
spring.datasource.username=${POSTGRES_USER:kradnik}
spring.datasource.password=${POSTGRES_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

telegram.bot.token=${TELEGRAM_BOT_TOKEN}
telegram.donation.url=${TELEGRAM_DONATION_URL:https://pay.cloudtips.ru/p/6f779a3d}
telegram.donation.channel-id=${TELEGRAM_DONATION_CHANNEL_ID:@mediakradnik}
telegram.donation.pin.enabled=${TELEGRAM_DONATION_PIN_ENABLED:false}
telegram.donation.pin-message-id=${TELEGRAM_DONATION_PIN_MESSAGE_ID:}

download.platform.youtube.enabled=${DOWNLOAD_PLATFORM_YOUTUBE_ENABLED:false}
download.platform.instagram.enabled=${DOWNLOAD_PLATFORM_INSTAGRAM_ENABLED:false}

download.instagram.rate-limit.scope=${DOWNLOAD_INSTAGRAM_RATE_LIMIT_SCOPE:vps-direct}
download.instagram.rate-limit.min-interval=${DOWNLOAD_INSTAGRAM_RATE_LIMIT_MIN_INTERVAL:30s}
download.instagram.rate-limit.max-jitter=${DOWNLOAD_INSTAGRAM_RATE_LIMIT_MAX_JITTER:15s}
download.instagram.rate-limit.initial-cooldown=${DOWNLOAD_INSTAGRAM_RATE_LIMIT_INITIAL_COOLDOWN:30m}
download.instagram.rate-limit.max-cooldown=${DOWNLOAD_INSTAGRAM_RATE_LIMIT_MAX_COOLDOWN:6h}
download.instagram.rate-limit.cooldown-multiplier=${DOWNLOAD_INSTAGRAM_RATE_LIMIT_COOLDOWN_MULTIPLIER:2}
