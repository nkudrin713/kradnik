link.required=🔗 I need a link
help.text=🧭 Download from a link:\n\
- Video in an available quality, audio, or a cover.\n\
- Up to 100 tracks from a YouTube playlist.\n\
Files already uploaded to Telegram are returned instantly.\n\n\
Limits:\n\
- No large videos. Guideline: up to 20–40 minutes, depending on quality and size.\n\
- No 18+ or private content. No bypassing logins, paywalls, or platform restrictions.\n\
- Not every link is supported.\n\n\
Send a link → choose video quality, audio, or a cover → wait for the file.
legal.text=Disclaimer:\n\
- The bot is a technical tool for processing links submitted by users.\n\
- The bot is not intended to infringe copyright, related rights, or any other rights.\n\
- Users are solely responsible for ensuring they have the right to download, store, and distribute materials from submitted links.\n\
- Public availability of a link, page, or file does not mean the material may be freely copied, downloaded, or distributed.\n\
- The project author does not host user content, maintain a catalog of materials, or verify the legal status of every link.\n\
- Files are processed automatically based on links submitted by users.\n\
- Donations are voluntary support for the project infrastructure and are not payment for access to any content.\n\
- Donations may be used for hosting, traffic, reliability, new features, and project development.\n\
- If you are a rights holder and believe the bot is being used to infringe your rights, contact the project author to have the matter reviewed.\n\
- The name “Kradnik,” words such as “theft,” and the pirate theme are part of the project’s ironic identity and are not an encouragement to break the law.
donation.unavailable=Donations are not configured yet. The pirate accountant is asleep.
donation.message=❤️ Kradnik remains free.\n\nThis is a tip jar for anyone who wants to add some fuel to the project.\nDonations pay for hosting, new features, and the developer’s peace of mind.\nI promise not to spend them on beer or cigarettes.\n\nThank you for helping the bot stay alive.
